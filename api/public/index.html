
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIMLOCK PEDINHIOS ADMIN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090713;color:#eee;font-family:Arial,sans-serif;padding:22px}
main{max-width:900px;margin:auto}
h1{color:#b78aff;text-shadow:0 0 15px #8c39ff}
.card{background:#19112a;border:1px solid #56317d;border-radius:15px;padding:18px;margin:16px 0}
input,button{padding:12px;border-radius:9px;border:1px solid #65428b;margin:5px 0;font-size:15px}
input{background:#100b1c;color:white;width:100%}
button{background:#8538dc;color:white;font-weight:bold;cursor:pointer}
button.danger{background:#a52b46}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
#message{color:#65ff9b;white-space:pre-wrap}
.item{border-top:1px solid #49345f;padding:12px 0;overflow-wrap:anywhere}
small{color:#bba9d1}
</style>
</head>
<body>
<main>
<h1>⚡ AIMLOCK PEDINHIOS</h1>
<p>KEY MANAGEMENT SYSTEM</p>

<section class="card">
<h3>Đăng nhập quản trị</h3>
<input id="api" placeholder="Địa chỉ API, ví dụ https://ten-app.onrender.com">
<input id="token" type="password" placeholder="ADMIN_TOKEN">
<button onclick="loadKeys()">Đăng nhập</button>
<p id="message"></p>
</section>

<section class="card">
<h3>➕ Tạo KEY mới</h3>
<input id="days" type="number" min="1" max="3650" value="30" placeholder="Số ngày">
<input id="note" placeholder="Ghi chú KEY">
<button onclick="createKey()">Tạo KEY</button>
<div id="newKey"></div>
</section>

<section class="card">
<h3>📋 Danh sách KEY</h3>
<button onclick="loadKeys()">Làm mới danh sách</button>
<div id="keys"></div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const api = () => $('api').value.trim().replace(/\/+$/,'');
const headers = () => ({
  'Content-Type':'application/json',
  'Authorization':'Bearer '+$('token').value
});

async function request(path, options={}) {
  const response = await fetch(api()+path,{
    ...options,
    headers:{...headers(),...(options.headers||{})}
  });
  const data = await response.json();
  if(!response.ok) throw new Error(data.message || 'Có lỗi xảy ra');
  return data;
}

async function loadKeys(){
  try{
    const data=await request('/api/admin/keys');
    $('keys').innerHTML='';
    data.keys.forEach(k=>{
      const item=document.createElement('div');
      item.className='item';
      const title=document.createElement('b');
      title.textContent='KEY '+k.key_hint;
      const details=document.createElement('p');
      details.textContent='Trạng thái: '+k.status+
        ' | Hết hạn: '+new Date(k.expires_at).toLocaleString('vi-VN');
      const note=document.createElement('small');
      note.textContent=k.note || 'Không có ghi chú';
      item.append(title,details,note);
      if(k.status==='active'){
        const btn=document.createElement('button');
        btn.className='danger';
        btn.textContent='Khóa KEY';
        btn.onclick=()=>revokeKey(k.id);
        item.appendChild(btn);
      }
      $('keys').appendChild(item);
    });
    $('message').textContent='✅ Kết nối thành công';
  }catch(e){
    $('message').textContent='❌ '+e.message;
  }
}

async function createKey(){
  try{
    const days=Number($('days').value);
    if(!Number.isInteger(days)||days<1||days>3650)
      throw new Error('Số ngày phải từ 1 đến 3650');
    const data=await request('/api/admin/keys',{
      method:'POST',
      body:JSON.stringify({days,note:$('note').value})
    });
    $('newKey').textContent='KEY mới: '+data.key+
      ' (Hãy lưu lại, chỉ hiển thị một lần)';
    $('message').textContent='✅ Đã tạo KEY';
    await loadKeys();
  }catch(e){
    $('message').textContent='❌ '+e.message;
  }
}

async function revokeKey(id){
  if(!confirm('Bạn có chắc muốn khóa KEY này?'))return;
  try{
    await request('/api/admin/keys/'+id+'/revoke',{method:'POST'});
    $('message').textContent='✅ Đã khóa KEY';
    await loadKeys();
  }catch(e){
    $('message').textContent='❌ '+e.message;
  }
}
</script>
</body>
</html>
